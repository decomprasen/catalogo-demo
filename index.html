<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ======================================================================
   ⚙️  CONFIGURACIÓN — LO ÚNICO QUE PEDRO TIENE QUE TOCAR PARA CADA COMERCIO
   Buscá el bloque "CONFIGURACIÓN" más abajo en la etiqueta <script>.
   Acá arriba solo hay estilos visuales.
   ====================================================================== */

:root{
  --verde-hoja:#1F5C4F;
  --verde-oscuro:#123B32;
  --crema:#F6F7F1;
  --papel:#FFFFFF;
  --coral:#E4572E;
  --coral-oscuro:#C64620;
  --linea:#E1E4DC;
  --texto:#1B2420;
  --texto-suave:#5B6560;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--crema);
  color:var(--texto);
  font-family:'Karla', system-ui, sans-serif;
  line-height:1.5;
  padding-bottom:60px;
}

h1,h2,h3, .num{
  font-family:'Sora', system-ui, sans-serif;
}

/* ---------- Encabezado ---------- */

header.tienda{
  background:var(--verde-hoja);
  color:var(--crema);
  padding:28px 20px 34px;
  position:relative;
  overflow:hidden;
}

header.tienda::after{
  content:"";
  position:absolute;
  right:-40px; top:-60px;
  width:220px; height:220px;
  border-radius:50%;
  background:var(--verde-oscuro);
  opacity:.55;
}

.header-inner{
  max-width:900px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
}

.marca h1{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.01em;
}

.marca p{
  margin-top:6px;
  font-size:14.5px;
  color:#D7E6DF;
  max-width:420px;
}

.info-envio{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.chip{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  color:var(--crema);
  font-size:12.5px;
  padding:6px 12px;
  border-radius:20px;
}

/* ---------- Botón carrito flotante en el header ---------- */

.btn-carrito{
  background:var(--coral);
  color:white;
  border:none;
  border-radius:14px;
  padding:10px 16px;
  font-family:'Karla', sans-serif;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  transition:transform .15s ease, background .15s ease;
}
.btn-carrito:hover{ background:var(--coral-oscuro); }
.btn-carrito:active{ transform:scale(.96); }

.badge{
  background:white;
  color:var(--coral-oscuro);
  font-weight:800;
  font-size:12px;
  min-width:20px;
  height:20px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 5px;
}

/* ---------- Buscador ---------- */

.buscador-wrap{
  max-width:900px;
  margin:18px auto 0;
  padding:0 20px;
}

.buscador-wrap input{
  width:100%;
  border:1px solid var(--linea);
  background:var(--papel);
  border-radius:12px;
  padding:11px 14px;
  font-family:'Karla', sans-serif;
  font-size:14px;
  color:var(--texto);
}
.buscador-wrap input:focus{
  outline:none;
  border-color:var(--verde-hoja);
}

/* ---------- Categorías ---------- */

.categorias{
  max-width:900px;
  margin:22px auto 0;
  padding:0 20px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.categorias::-webkit-scrollbar{display:none;}

.cat-btn{
  border:1px solid var(--linea);
  background:var(--papel);
  color:var(--texto-suave);
  padding:8px 16px;
  border-radius:20px;
  font-size:13.5px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .15s ease;
}
.cat-btn.activo{
  background:var(--verde-hoja);
  border-color:var(--verde-hoja);
  color:white;
}

/* ---------- Grilla de productos ---------- */

main{
  max-width:900px;
  margin:22px auto 0;
  padding:0 20px;
}

.grilla{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
  gap:16px;
  margin-top:16px;
}

.sin-resultados{
  grid-column:1/-1;
  text-align:center;
  color:var(--texto-suave);
  font-size:14px;
  padding:30px 10px;
}

@media (max-width:600px){
  .grilla{
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  .foto-producto{ font-size:34px; }
  .datos-producto{ padding:10px; }
  .nombre-producto{ font-size:13px; }
  .precio{ font-size:15px; }
  .btn-agregar{ padding:6px 10px; font-size:12px; }
}

.producto{
  background:var(--papel);
  border:1px solid var(--linea);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.foto-producto{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  background:var(--crema);
  border-bottom:1px solid var(--linea);
  overflow:hidden;
  position:relative;
}

.badge-sinstock{
  position:absolute;
  top:8px; left:8px;
  background:var(--coral-oscuro);
  color:white;
  font-size:10.5px;
  font-weight:700;
  padding:3px 8px;
  border-radius:6px;
  z-index:2;
}

.producto.sin-stock .foto-producto{ opacity:.45; }
.producto.sin-stock .nombre-producto,
.producto.sin-stock .precio{ color:var(--texto-suave); }

.galeria-img{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.flecha{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:26px; height:26px;
  border-radius:50%;
  border:none;
  background:rgba(18,26,22,.55);
  color:white;
  font-size:16px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
}
.flecha-izq{ left:6px; }
.flecha-der{ right:6px; }
.flecha:hover{ background:rgba(18,26,22,.8); }

.puntos-img{
  position:absolute;
  bottom:8px;
  left:0; right:0;
  display:flex;
  justify-content:center;
  gap:5px;
  z-index:3;
}
.punto{
  width:6px; height:6px;
  border-radius:50%;
  background:rgba(255,255,255,.6);
  cursor:pointer;
}
.punto.activo{ background:white; }

.foto-producto img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.emoji-respaldo{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.datos-producto{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
}

.nombre-producto{
  font-weight:600;
  font-size:14.5px;
  line-height:1.3;
}

.desc-producto{
  font-size:12.5px;
  color:var(--texto-suave);
  flex:1;
}

.unidad-precio{
  font-size:11px;
  font-weight:600;
  color:var(--texto-suave);
  margin-left:2px;
}

.fila-precio{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
}

.precio{
  font-family:'Sora', sans-serif;
  font-weight:700;
  font-size:16.5px;
  color:var(--verde-oscuro);
}

.btn-agregar{
  background:var(--verde-hoja);
  color:white;
  border:none;
  border-radius:10px;
  padding:7px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.btn-agregar:hover{ background:var(--verde-oscuro); }
.btn-agregar:disabled{
  background:#D8DBD5;
  color:var(--texto-suave);
  cursor:not-allowed;
}

/* ---------- Carrito lateral ---------- */

.fondo-oscuro{
  position:fixed; inset:0;
  background:rgba(18,26,22,.45);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
  z-index:20;
}
.fondo-oscuro.abierto{ opacity:1; pointer-events:auto; }

.panel-carrito{
  position:fixed;
  top:0; right:0;
  height:100%;
  width:min(420px, 100%);
  background:var(--papel);
  z-index:21;
  transform:translateX(100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
}
.panel-carrito.abierto{ transform:translateX(0); }

.panel-header{
  padding:18px 20px;
  border-bottom:1px solid var(--linea);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.panel-header h2{ font-size:18px; }

.cerrar{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  color:var(--texto-suave);
  line-height:1;
}

.panel-body{
  flex:1;
  overflow-y:auto;
  padding:16px 20px;
}

.vacio{
  color:var(--texto-suave);
  font-size:14px;
  text-align:center;
  margin-top:40px;
}

.item-carrito{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--linea);
  align-items:center;
}

.item-icono{
  width:44px; height:44px;
  border-radius:10px;
  background:var(--crema);
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  flex-shrink:0;
}

.item-info{ flex:1; }
.item-nombre{ font-weight:600; font-size:13.5px; }
.item-precio-unit{ font-size:12px; color:var(--texto-suave); margin-top:2px; }

.stepper{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}
.stepper button{
  width:24px; height:24px;
  border-radius:6px;
  border:1px solid var(--linea);
  background:var(--papel);
  cursor:pointer;
  font-size:14px;
  line-height:1;
}
.stepper span{ font-size:13.5px; font-weight:600; min-width:16px; text-align:center; }

.quitar{
  background:none;
  border:none;
  color:var(--coral-oscuro);
  font-size:12px;
  cursor:pointer;
  text-decoration:underline;
  margin-top:4px;
}

.panel-footer{
  border-top:1px solid var(--linea);
  padding:16px 20px 20px;
}

.fila-subtotal{
  display:flex;
  justify-content:space-between;
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
}

.btn-continuar{
  width:100%;
  background:var(--coral);
  color:white;
  border:none;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  font-family:'Karla', sans-serif;
}
.btn-continuar:hover{ background:var(--coral-oscuro); }
.btn-continuar:disabled{ background:#C9CFC8; cursor:not-allowed; }

.btn-secundario{
  width:100%;
  background:none;
  color:var(--verde-hoja);
  border:1px solid var(--linea);
  border-radius:12px;
  padding:11px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  font-family:'Karla', sans-serif;
  margin-top:8px;
}
.btn-secundario:hover{ background:var(--crema); }

/* ---------- Formulario de pedido ---------- */

.campo{ margin-bottom:14px; }
.campo label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--texto-suave);
  margin-bottom:5px;
}
.campo input, .campo textarea{
  width:100%;
  border:1px solid var(--linea);
  border-radius:9px;
  padding:9px 11px;
  font-family:'Karla', sans-serif;
  font-size:14px;
  color:var(--texto);
}
.campo textarea{ resize:vertical; min-height:60px; }

.opciones-entrega{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
.opcion-entrega{
  flex:1;
  border:1px solid var(--linea);
  border-radius:10px;
  padding:10px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  color:var(--texto-suave);
}
.opcion-entrega.activo{
  border-color:var(--verde-hoja);
  background:#EAF2EE;
  color:var(--verde-oscuro);
}

.volver{
  background:none;
  border:none;
  color:var(--verde-hoja);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:14px;
}

.aviso-envio{
  font-size:12px;
  color:var(--texto-suave);
  background:var(--crema);
  border-radius:8px;
  padding:9px 11px;
  margin-bottom:14px;
}

@media (max-width:480px){
  .header-top{ flex-direction:column; }
  .btn-carrito{ align-self:flex-start; }
}
</style>
</head>
<body>

<header class="tienda">
  <div class="header-inner">
    <div class="header-top">
      <div class="marca">
        <h1 id="nombreTienda">Catálogo Demo</h1>
        <p id="descTienda">Ejemplo de catálogo con productos de distintos rubros. Elegí, armá tu pedido y coordinamos todo por WhatsApp.</p>
      </div>
      <button class="btn-carrito" id="btnAbrirCarrito">
        🛒 Carrito <span class="badge" id="cantidadCarrito">0</span>
      </button>
    </div>
    <div class="info-envio">
      <span class="chip">🚚 Envío a domicilio (a cargo del cliente)</span>
      <span class="chip">🏪 Retiro en el local</span>
    </div>
  </div>
</header>

<div class="buscador-wrap">
  <input type="text" id="buscador" placeholder="🔎 Buscar producto...">
</div>

<div class="categorias" id="categorias"></div>

<main>
  <div class="grilla" id="grillaProductos"></div>
</main>

<!-- ---------- Carrito ---------- -->
<div class="fondo-oscuro" id="fondoOscuro"></div>

<aside class="panel-carrito" id="panelCarrito">

  <div class="panel-header">
    <h2 id="tituloPanel">Tu pedido</h2>
    <button class="cerrar" id="btnCerrarCarrito">✕</button>
  </div>

  <div class="panel-body" id="cuerpoPanel">
    <!-- se llena con JS -->
  </div>

  <div class="panel-footer" id="piePanel">
    <!-- se llena con JS -->
  </div>

</aside>

<script>
/* ======================================================================
   ⚙️  CONFIGURACIÓN — ACÁ ES DONDE PEDRO EDITA CADA CATÁLOGO
   No hace falta saber programar: es solo cambiar lo que está entre comillas
   o los números, respetando las comas.
   ====================================================================== */

// 1) Datos del comercio
const TIENDA = {
  nombre: "Catálogo Demo",
  descripcion: "Ejemplo de catálogo con productos de distintos rubros. Elegí, armá tu pedido y coordinamos todo por WhatsApp.",
  // Número de WhatsApp SIN el "+", SIN espacios ni guiones.
  // Ejemplo Argentina Chacabuco: código país 54 + 9 + código de área SIN el 0 + número SIN el 15
  whatsapp: "5492364410707",
  // Costo de envío EN NÚMEROS (sin puntos ni comas). Ejemplo: 1500
  // Si lo dejás en 0, se muestra el texto de "costoEnvioTexto" en vez de un monto fijo.
  costoEnvio: 1500,
  // Este texto solo se usa si costoEnvio está en 0 (envío "a coordinar").
  costoEnvioTexto: "El costo de envío se coordina y lo abona el cliente al recibir el pedido.",
  // Datos que se muestran cuando el cliente elige pagar por transferencia.
  // Cada línea de esta lista aparece en un renglón distinto. Se pueden agregar
  // o sacar líneas, o dejar la lista vacía [] si el comercio no usa transferencia.
  datosTransferencia: [
    "Alias: donalimpia.mp",
    "CBU: 0000003100000012345678",
    "Titular: Nombre Apellido"
  ]
};

// 2) Categorías (tienen que coincidir con la "categoria" de cada producto)
//    Estas son SOLO DE EJEMPLO, para mostrar que el catálogo sirve para
//    cualquier rubro. Para un comercio real, dejás nada más las categorías
//    que ese comercio necesita.
const CATEGORIAS = ["Todos", "Verdulería", "Panadería", "Fiambrería", "Ferretería", "Indumentaria", "Muebles", "Limpieza"];

// 3) Productos. Cada producto tiene:
//    - icono: un emoji que se usa como foto de ejemplo (siempre queda como respaldo)
//    - imagen: OPCIONAL, para productos con UNA sola foto.
//      Nombre del archivo guardado en la carpeta "imagenes". Ej: "imagenes/tomate.jpg"
//    - imagenes: OPCIONAL, para productos con VARIAS fotos (por ejemplo un mueble
//      visto desde distintos ángulos, o con detalles). Es una lista entre corchetes.
//      Ej: imagenes:["imagenes/mesa-frente.jpg","imagenes/mesa-lateral.jpg"]
//      Si un producto tiene "imagenes", esas fotos se muestran con flechitas para
//      pasar de una a otra. Si solo tiene "imagen" (una sola), no aparecen flechitas.
//      Si no tiene ninguna de las dos (o el archivo no se encuentra), se muestra el emoji.
//    - stock: true = se puede agregar al carrito. false = aparece como "Sin stock"
//      y no se puede agregar. Por ahora esto se cambia a mano; más adelante
//      se puede conectar a un Google Sheet para que se actualice solo.
//    - porPeso: OPCIONAL, poner true SOLO en productos que se venden por peso
//      (verdura, fruta, fiambre, pan, etc.). El precio se muestra como precio
//      por kg, y en el carrito la cantidad se suma/resta en gramos en vez de
//      en unidades enteras.
//    - pasoPesoKg: OPCIONAL, solo tiene sentido junto con porPeso:true. Define
//      de a cuánto se suma/resta la cantidad en el carrito, EN KILOS:
//      0.25 = de a 250g (ideal para verdura/fruta), 0.1 = de a 100g (ideal
//      para fiambres/quesos). Si no se pone nada, suma de a 0.5 kg (500g).
//      Así cada rubro puede tener su propio paso.
const PRODUCTOS = [
  // ---- Verdulería (ejemplo: paso de 250g, ideal para fruta y verdura) ----
  { id:1, nombre:"Tomate x kg", categoria:"Verdulería", precio:1400, icono:"🍅", imagen:"", stock:true, porPeso:true, pasoPesoKg:0.25, desc:"Fresco, seleccionado" },
  { id:2, nombre:"Papa x kg", categoria:"Verdulería", precio:900, icono:"🥔", imagen:"", stock:true, porPeso:true, pasoPesoKg:0.25, desc:"" },
  { id:3, nombre:"Banana x kg", categoria:"Verdulería", precio:1300, icono:"🍌", imagen:"", stock:true, porPeso:true, pasoPesoKg:0.25, desc:"" },
  { id:4, nombre:"Lechuga (unidad)", categoria:"Verdulería", precio:700, icono:"🥬", imagen:"", stock:false, desc:"" },
  { id:5, nombre:"Zapallo x kg", categoria:"Verdulería", precio:850, icono:"🎃", imagen:"", stock:true, porPeso:true, pasoPesoKg:0.25, desc:"" },

  // ---- Panadería (ejemplo) ----
  { id:6, nombre:"Pan francés x kg", categoria:"Panadería", precio:2100, icono:"🥖", imagen:"", stock:true, porPeso:true, desc:"Recién horneado" },
  { id:7, nombre:"Facturas x6", categoria:"Panadería", precio:2400, icono:"🥐", imagen:"", stock:true, desc:"Surtidas" },
  { id:8, nombre:"Pan lactal", categoria:"Panadería", precio:1900, icono:"🍞", imagen:"", stock:true, desc:"" },
  { id:9, nombre:"Bizcochos x kg", categoria:"Panadería", precio:2600, icono:"🥨", imagen:"", stock:true, porPeso:true, desc:"" },
  { id:10, nombre:"Torta individual", categoria:"Panadería", precio:1800, icono:"🍰", imagen:"", stock:false, desc:"" },

  // ---- Fiambrería (ejemplo: paso de 100g, ideal para fiambres y quesos) ----
  { id:30, nombre:"Jamón cocido x kg", categoria:"Fiambrería", precio:9800, icono:"🥓", imagen:"", stock:true, porPeso:true, pasoPesoKg:0.1, desc:"" },
  { id:31, nombre:"Queso cremoso x kg", categoria:"Fiambrería", precio:11500, icono:"🧀", imagen:"", stock:true, porPeso:true, pasoPesoKg:0.1, desc:"" },
  { id:32, nombre:"Salame x kg", categoria:"Fiambrería", precio:13200, icono:"🌭", imagen:"", stock:true, porPeso:true, pasoPesoKg:0.1, desc:"" },

  // ---- Ferretería (ejemplo) ----
  { id:11, nombre:"Tornillos x50", categoria:"Ferretería", precio:1200, icono:"🔩", imagen:"", stock:true, desc:"Surtidos" },
  { id:12, nombre:"Cinta aisladora", categoria:"Ferretería", precio:900, icono:"🧰", imagen:"", stock:true, desc:"" },
  { id:13, nombre:"Pilas AA x4", categoria:"Ferretería", precio:1600, icono:"🔋", imagen:"", stock:true, desc:"" },

/* ======================================================================
   A PARTIR DE ACÁ ES EL FUNCIONAMIENTO DEL CATÁLOGO.
   No hace falta tocar nada de lo que sigue.
   ====================================================================== */

document.getElementById("nombreTienda").textContent = TIENDA.nombre;
document.getElementById("descTienda").textContent = TIENDA.descripcion;
document.title = "Catálogo " + TIENDA.nombre;

let carrito = [];
try{
  const guardado = localStorage.getItem("carrito_" + TIENDA.nombre);
  if(guardado) carrito = JSON.parse(guardado);
}catch(e){ carrito = []; }

let categoriaActiva = "Todos";
let textoBusqueda = "";
let vistaCarrito = "lista"; // "lista" | "formulario"
let entregaElegida = "retiro"; // "retiro" | "envio"
let formaPagoElegida = "efectivo"; // "efectivo" | "transferencia"

function guardarCarrito(){
  try{ localStorage.setItem("carrito_" + TIENDA.nombre, JSON.stringify(carrito)); }catch(e){}
}

function formatoPrecio(numero){
  return "$" + numero.toLocaleString("es-AR");
}

// ---------- Categorías ----------
function pintarCategorias(){
  const cont = document.getElementById("categorias");
  cont.innerHTML = "";
  CATEGORIAS.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === categoriaActiva ? " activo" : "");
    btn.textContent = cat;
    btn.onclick = () => { categoriaActiva = cat; pintarCategorias(); pintarProductos(); };
    cont.appendChild(btn);
  });
}

// ---------- Grilla de productos ----------
function pintarProductos(){
  const cont = document.getElementById("grillaProductos");
  cont.innerHTML = "";

  const lista = PRODUCTOS.filter(p => {
    if(textoBusqueda){
      // Mientras se está buscando, se busca en TODO el catálogo,
      // sin importar qué categoría esté seleccionada.
      return p.nombre.toLowerCase().includes(textoBusqueda) ||
             (p.desc || "").toLowerCase().includes(textoBusqueda);
    }
    return categoriaActiva === "Todos" || p.categoria === categoriaActiva;
  });

  if(lista.length === 0){
    cont.innerHTML = `<p class="sin-resultados">No encontramos productos que coincidan con "${textoBusqueda}".</p>`;
    return;
  }

  lista.forEach(p => {
    const sinStock = p.stock === false;
    // Lista de fotos del producto: si tiene "imagenes" (varias), se usa esa.
    // Si no, y tiene "imagen" (una sola), se usa como lista de un solo elemento.
    const imagenes = (p.imagenes && p.imagenes.length) ? p.imagenes : (p.imagen ? [p.imagen] : []);

    const card = document.createElement("div");
    card.className = "producto" + (sinStock ? " sin-stock" : "");

    card.innerHTML = `
      <div class="foto-producto">
        ${sinStock ? '<span class="badge-sinstock">Sin stock</span>' : ""}
        <div class="galeria-img"></div>
        ${imagenes.length > 1 ? `
          <button class="flecha flecha-izq" type="button" aria-label="Foto anterior">‹</button>
          <button class="flecha flecha-der" type="button" aria-label="Foto siguiente">›</button>
          <div class="puntos-img">${imagenes.map((_, i) => `<span class="punto" data-i="${i}"></span>`).join("")}</div>
        ` : ""}
      </div>
      <div class="datos-producto">
        <div class="nombre-producto">${p.nombre}</div>
        <div class="desc-producto">${p.desc || ""}</div>
        <div class="fila-precio">
          <span class="precio">${formatoPrecio(p.precio)}${p.porPeso ? '<span class="unidad-precio">/kg</span>' : ""}</span>
          <button class="btn-agregar" ${sinStock ? "disabled" : ""}>${sinStock ? "Sin stock" : "Agregar"}</button>
        </div>
      </div>
    `;

    // ---- Lógica de la galería de fotos de esta tarjeta ----
    let indiceImg = 0;
    const contenedorImg = card.querySelector(".galeria-img");

    function pintarImagenActual(){
      contenedorImg.innerHTML = imagenes.length
        ? `<img src="${imagenes[indiceImg]}" alt="${p.nombre}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'emoji-respaldo',textContent:'${p.icono}'}))">`
        : `<div class="emoji-respaldo">${p.icono}</div>`;
      card.querySelectorAll(".punto").forEach((pt, i) => pt.classList.toggle("activo", i === indiceImg));
    }
    pintarImagenActual();

    if(imagenes.length > 1){
      card.querySelector(".flecha-izq").onclick = () => {
        indiceImg = (indiceImg - 1 + imagenes.length) % imagenes.length;
        pintarImagenActual();
      };
      card.querySelector(".flecha-der").onclick = () => {
        indiceImg = (indiceImg + 1) % imagenes.length;
        pintarImagenActual();
      };
      card.querySelectorAll(".punto").forEach(pt => {
        pt.onclick = () => { indiceImg = parseInt(pt.dataset.i); pintarImagenActual(); };
      });
    }

    if(!sinStock){
      card.querySelector(".btn-agregar").onclick = () => agregarAlCarrito(p);
    }
    cont.appendChild(card);
  });
}

// ---------- Lógica del carrito ----------
function agregarAlCarrito(producto){
  const existente = carrito.find(i => i.id === producto.id);
  if(existente){ existente.cantidad += 1; }
  else{ carrito.push({ ...producto, cantidad: 1 }); }
  guardarCarrito();
  actualizarBadge();
  abrirCarrito();
}

function cambiarCantidad(id, delta){
  const item = carrito.find(i => i.id === id);
  if(!item) return;
  const paso = item.porPeso ? (item.pasoPesoKg || 0.5) : 1;
  item.cantidad = Math.round((item.cantidad + delta * paso) * 100) / 100;
  if(item.cantidad <= 0){ carrito = carrito.filter(i => i.id !== id); }
  guardarCarrito();
  actualizarBadge();
  pintarPanelCarrito();
}

function formatoCantidad(item){
  return item.porPeso ? `${item.cantidad} kg` : item.cantidad;
}

function hayProductoPorPeso(){
  return carrito.some(i => i.porPeso);
}

// Texto que se muestra cuando hay productos por peso en el carrito.
// Se puede editar libremente el redactado sin romper nada.
const AVISO_PESO = "⚖️ Los productos que se venden por peso se cobran según lo que marque la balanza al pesarlos: el monto puede ajustarse un poco respecto a lo que ves acá.";

function quitarDelCarrito(id){
  carrito = carrito.filter(i => i.id !== id);
  guardarCarrito();
  actualizarBadge();
  pintarPanelCarrito();
}

function subtotalCarrito(){
  return carrito.reduce((acc, i) => acc + i.precio * i.cantidad, 0);
}

function cantidadTotalCarrito(){
  return carrito.length;
}

function actualizarBadge(){
  document.getElementById("cantidadCarrito").textContent = cantidadTotalCarrito();
}

// ---------- Panel lateral ----------
function abrirCarrito(){
  vistaCarrito = "lista";
  document.getElementById("fondoOscuro").classList.add("abierto");
  document.getElementById("panelCarrito").classList.add("abierto");
  pintarPanelCarrito();
}

function cerrarCarrito(){
  document.getElementById("fondoOscuro").classList.remove("abierto");
  document.getElementById("panelCarrito").classList.remove("abierto");
}

function pintarPanelCarrito(){
  if(vistaCarrito === "lista"){ pintarVistaLista(); }
  else{ pintarVistaFormulario(); }
}

function pintarVistaLista(){
  document.getElementById("tituloPanel").textContent = "Tu pedido";
  const cuerpo = document.getElementById("cuerpoPanel");
  const pie = document.getElementById("piePanel");

  if(carrito.length === 0){
    cuerpo.innerHTML = `<p class="vacio">Todavía no agregaste productos.</p>`;
    pie.innerHTML = "";
    return;
  }

  cuerpo.innerHTML = carrito.map(i => `
    <div class="item-carrito">
      <div class="item-icono">${i.icono}</div>
      <div class="item-info">
        <div class="item-nombre">${i.nombre}</div>
        <div class="item-precio-unit">${formatoPrecio(i.precio)} ${i.porPeso ? "por kg" : "c/u"}</div>
        <div class="stepper">
          <button onclick="cambiarCantidad(${i.id}, -1)">−</button>
          <span>${formatoCantidad(i)}</span>
          <button onclick="cambiarCantidad(${i.id}, 1)">+</button>
        </div>
        <button class="quitar" onclick="quitarDelCarrito(${i.id})">Quitar</button>
      </div>
    </div>
  `).join("");

  pie.innerHTML = `
    ${hayProductoPorPeso() ? `<div class="aviso-envio">${AVISO_PESO}</div>` : ""}
    <div class="fila-subtotal">
      <span>Subtotal</span>
      <span>${formatoPrecio(subtotalCarrito())}</span>
    </div>
    <button class="btn-continuar" id="btnContinuar">Finalizar pedido</button>
    <button class="btn-secundario" id="btnSeguirComprando">Seguir comprando</button>
  `;
  document.getElementById("btnContinuar").onclick = () => {
    vistaCarrito = "formulario";
    pintarPanelCarrito();
  };
  document.getElementById("btnSeguirComprando").onclick = cerrarCarrito;
}

function pintarVistaFormulario(){
  document.getElementById("tituloPanel").textContent = "Tus datos";
  const cuerpo = document.getElementById("cuerpoPanel");
  const pie = document.getElementById("piePanel");

  cuerpo.innerHTML = `
    <button class="volver" id="btnVolver">← Volver al pedido</button>

    <div class="opciones-entrega">
      <div class="opcion-entrega ${entregaElegida === 'retiro' ? 'activo' : ''}" id="optRetiro">🏪 Retiro en el local</div>
      <div class="opcion-entrega ${entregaElegida === 'envio' ? 'activo' : ''}" id="optEnvio">🚚 Envío a domicilio</div>
    </div>

    ${entregaElegida === 'envio' ? `<div class="aviso-envio">🚚 ${TIENDA.costoEnvio > 0 ? `Costo de envío: ${formatoPrecio(TIENDA.costoEnvio)} — se abona aparte, al cadete, en el momento de la entrega.` : TIENDA.costoEnvioTexto}</div>` : ""}

    <div class="opciones-entrega">
      <div class="opcion-entrega ${formaPagoElegida === 'efectivo' ? 'activo' : ''}" id="optEfectivo">💵 Efectivo</div>
      <div class="opcion-entrega ${formaPagoElegida === 'transferencia' ? 'activo' : ''}" id="optTransferencia">🏦 Transferencia</div>
    </div>

    ${formaPagoElegida === 'transferencia' && TIENDA.datosTransferencia.length ? `<div class="aviso-envio">${TIENDA.datosTransferencia.join("<br>")}</div>` : ""}

    <div class="campo">
      <label>Nombre y apellido</label>
      <input type="text" id="campoNombre" placeholder="Tu nombre">
    </div>
    <div class="campo">
      <label>Teléfono</label>
      <input type="tel" id="campoTelefono" placeholder="Tu número de contacto">
    </div>
    ${entregaElegida === 'envio' ? `
    <div class="campo">
      <label>Dirección de entrega</label>
      <input type="text" id="campoDireccion" placeholder="Calle, número, referencia">
    </div>` : ""}
    <div class="campo">
      <label>Aclaraciones (opcional)</label>
      <textarea id="campoNotas" placeholder="Ej: horario preferido, forma de pago, etc."></textarea>
    </div>
  `;

  document.getElementById("btnVolver").onclick = () => { vistaCarrito = "lista"; pintarPanelCarrito(); };
  document.getElementById("optRetiro").onclick = () => { entregaElegida = "retiro"; pintarVistaFormulario(); };
  document.getElementById("optEnvio").onclick = () => { entregaElegida = "envio"; pintarVistaFormulario(); };
  document.getElementById("optEfectivo").onclick = () => { formaPagoElegida = "efectivo"; pintarVistaFormulario(); };
  document.getElementById("optTransferencia").onclick = () => { formaPagoElegida = "transferencia"; pintarVistaFormulario(); };

  const envioActual = entregaElegida === "envio" && TIENDA.costoEnvio > 0 ? TIENDA.costoEnvio : 0;

  pie.innerHTML = `
    ${hayProductoPorPeso() ? `<div class="aviso-envio">${AVISO_PESO}</div>` : ""}
    <div class="fila-subtotal">
      <span>Subtotal — a pagar al comercio</span>
      <span>${formatoPrecio(subtotalCarrito())}</span>
    </div>
    ${envioActual > 0 ? `
    <div class="fila-subtotal" style="font-size:13.5px; color:var(--texto-suave); font-weight:600;">
      <span>Envío — se paga aparte, al cadete</span>
      <span>${formatoPrecio(envioActual)}</span>
    </div>` : ""}
    <button class="btn-continuar" id="btnEnviarPedido">Enviar pedido por WhatsApp</button>
  `;
  document.getElementById("btnEnviarPedido").onclick = enviarPedidoPorWhatsapp;
}

// ---------- Armado y envío del mensaje de WhatsApp ----------
function enviarPedidoPorWhatsapp(){
  const nombre = document.getElementById("campoNombre").value.trim();
  const telefono = document.getElementById("campoTelefono").value.trim();
  const direccion = entregaElegida === "envio" ? document.getElementById("campoDireccion").value.trim() : "";
  const notas = document.getElementById("campoNotas").value.trim();

  if(!nombre || !telefono){
    alert("Por favor completá al menos tu nombre y tu teléfono.");
    return;
  }
  if(entregaElegida === "envio" && !direccion){
    alert("Por favor completá la dirección de entrega.");
    return;
  }

  let mensaje = `Hola ${TIENDA.nombre}! Quiero hacer este pedido:%0A%0A`;

  carrito.forEach(i => {
    mensaje += `• ${formatoCantidad(i)} x ${i.nombre} — ${formatoPrecio(i.precio * i.cantidad)}%0A`;
  });

  mensaje += `%0ATotal de la compra${hayProductoPorPeso() ? " (puede ajustarse al pesar)" : ""}: ${formatoPrecio(subtotalCarrito())}%0A%0A`;
  mensaje += `Modalidad: ${entregaElegida === "envio" ? "Envío a domicilio" : "Retiro en el local"}%0A`;
  mensaje += `Forma de pago: ${formaPagoElegida === "transferencia" ? "Transferencia" : "Efectivo"}%0A`;
  mensaje += `Nombre: ${nombre}%0A`;
  mensaje += `Teléfono: ${telefono}%0A`;
  if(direccion) mensaje += `Dirección: ${direccion}%0A`;
  if(notas) mensaje += `Notas: ${notas}%0A`;

  const url = `https://wa.me/${TIENDA.whatsapp}?text=${mensaje}`;
  window.open(url, "_blank");

  carrito = [];
  guardarCarrito();
  actualizarBadge();
  cerrarCarrito();
}

// ---------- Eventos generales ----------
document.getElementById("btnAbrirCarrito").onclick = abrirCarrito;
document.getElementById("btnCerrarCarrito").onclick = cerrarCarrito;
document.getElementById("fondoOscuro").onclick = cerrarCarrito;
document.getElementById("buscador").addEventListener("input", (e) => {
  textoBusqueda = e.target.value.trim().toLowerCase();
  pintarProductos();
});

// ---------- Arranque ----------
pintarCategorias();
pintarProductos();
actualizarBadge();
</script>
