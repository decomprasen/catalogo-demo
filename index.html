<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo Doña Limpia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ======================================================================
   ⚙️  CONFIGURACIÓN — LO ÚNICO QUE PEDRO TIENE QUE TOCAR PARA CADA COMERCIO
   Buscá el bloque "CONFIGURACIÓN" más abajo en la etiqueta <script>.
   Acá arriba solo hay estilos visuales.
   ====================================================================== */

:root{
  --verde-hoja:#1F5C4F;
  --verde-oscuro:#123B32;
  --crema:#F6F7F1;
  --papel:#FFFFFF;
  --coral:#E4572E;
  --coral-oscuro:#C64620;
  --linea:#E1E4DC;
  --texto:#1B2420;
  --texto-suave:#5B6560;
}

*{box-sizing:border-box; margin:0; padding:0;}

body{
  background:var(--crema);
  color:var(--texto);
  font-family:'Karla', system-ui, sans-serif;
  line-height:1.5;
  padding-bottom:60px;
}

h1,h2,h3, .num{
  font-family:'Sora', system-ui, sans-serif;
}

/* ---------- Encabezado ---------- */

header.tienda{
  background:var(--verde-hoja);
  color:var(--crema);
  padding:28px 20px 34px;
  position:relative;
  overflow:hidden;
}

header.tienda::after{
  content:"";
  position:absolute;
  right:-40px; top:-60px;
  width:220px; height:220px;
  border-radius:50%;
  background:var(--verde-oscuro);
  opacity:.55;
}

.header-inner{
  max-width:900px;
  margin:0 auto;
  position:relative;
  z-index:1;
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:16px;
}

.marca h1{
  font-size:28px;
  font-weight:800;
  letter-spacing:-0.01em;
}

.marca p{
  margin-top:6px;
  font-size:14.5px;
  color:#D7E6DF;
  max-width:420px;
}

.info-envio{
  margin-top:20px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.chip{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  color:var(--crema);
  font-size:12.5px;
  padding:6px 12px;
  border-radius:20px;
}

/* ---------- Botón carrito flotante en el header ---------- */

.btn-carrito{
  background:var(--coral);
  color:white;
  border:none;
  border-radius:14px;
  padding:10px 16px;
  font-family:'Karla', sans-serif;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
  transition:transform .15s ease, background .15s ease;
}
.btn-carrito:hover{ background:var(--coral-oscuro); }
.btn-carrito:active{ transform:scale(.96); }

.badge{
  background:white;
  color:var(--coral-oscuro);
  font-weight:800;
  font-size:12px;
  min-width:20px;
  height:20px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 5px;
}

/* ---------- Categorías ---------- */

.categorias{
  max-width:900px;
  margin:22px auto 0;
  padding:0 20px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}
.categorias::-webkit-scrollbar{display:none;}

.cat-btn{
  border:1px solid var(--linea);
  background:var(--papel);
  color:var(--texto-suave);
  padding:8px 16px;
  border-radius:20px;
  font-size:13.5px;
  font-weight:600;
  white-space:nowrap;
  cursor:pointer;
  transition:all .15s ease;
}
.cat-btn.activo{
  background:var(--verde-hoja);
  border-color:var(--verde-hoja);
  color:white;
}

/* ---------- Grilla de productos ---------- */

main{
  max-width:900px;
  margin:22px auto 0;
  padding:0 20px;
}

.grilla{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(200px,1fr));
  gap:16px;
  margin-top:16px;
}

.producto{
  background:var(--papel);
  border:1px solid var(--linea);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.foto-producto{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  background:var(--crema);
  border-bottom:1px solid var(--linea);
  overflow:hidden;
}

.foto-producto img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.emoji-respaldo{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
}

.datos-producto{
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:4px;
  flex:1;
}

.nombre-producto{
  font-weight:600;
  font-size:14.5px;
  line-height:1.3;
}

.desc-producto{
  font-size:12.5px;
  color:var(--texto-suave);
  flex:1;
}

.fila-precio{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
}

.precio{
  font-family:'Sora', sans-serif;
  font-weight:700;
  font-size:16.5px;
  color:var(--verde-oscuro);
}

.btn-agregar{
  background:var(--verde-hoja);
  color:white;
  border:none;
  border-radius:10px;
  padding:7px 12px;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.btn-agregar:hover{ background:var(--verde-oscuro); }

/* ---------- Carrito lateral ---------- */

.fondo-oscuro{
  position:fixed; inset:0;
  background:rgba(18,26,22,.45);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease;
  z-index:20;
}
.fondo-oscuro.abierto{ opacity:1; pointer-events:auto; }

.panel-carrito{
  position:fixed;
  top:0; right:0;
  height:100%;
  width:min(420px, 100%);
  background:var(--papel);
  z-index:21;
  transform:translateX(100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
}
.panel-carrito.abierto{ transform:translateX(0); }

.panel-header{
  padding:18px 20px;
  border-bottom:1px solid var(--linea);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.panel-header h2{ font-size:18px; }

.cerrar{
  background:none;
  border:none;
  font-size:22px;
  cursor:pointer;
  color:var(--texto-suave);
  line-height:1;
}

.panel-body{
  flex:1;
  overflow-y:auto;
  padding:16px 20px;
}

.vacio{
  color:var(--texto-suave);
  font-size:14px;
  text-align:center;
  margin-top:40px;
}

.item-carrito{
  display:flex;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--linea);
  align-items:center;
}

.item-icono{
  width:44px; height:44px;
  border-radius:10px;
  background:var(--crema);
  display:flex; align-items:center; justify-content:center;
  font-size:22px;
  flex-shrink:0;
}

.item-info{ flex:1; }
.item-nombre{ font-weight:600; font-size:13.5px; }
.item-precio-unit{ font-size:12px; color:var(--texto-suave); margin-top:2px; }

.stepper{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:6px;
}
.stepper button{
  width:24px; height:24px;
  border-radius:6px;
  border:1px solid var(--linea);
  background:var(--papel);
  cursor:pointer;
  font-size:14px;
  line-height:1;
}
.stepper span{ font-size:13.5px; font-weight:600; min-width:16px; text-align:center; }

.quitar{
  background:none;
  border:none;
  color:var(--coral-oscuro);
  font-size:12px;
  cursor:pointer;
  text-decoration:underline;
  margin-top:4px;
}

.panel-footer{
  border-top:1px solid var(--linea);
  padding:16px 20px 20px;
}

.fila-subtotal{
  display:flex;
  justify-content:space-between;
  font-size:15px;
  font-weight:700;
  margin-bottom:12px;
}

.btn-continuar{
  width:100%;
  background:var(--coral);
  color:white;
  border:none;
  border-radius:12px;
  padding:13px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  font-family:'Karla', sans-serif;
}
.btn-continuar:hover{ background:var(--coral-oscuro); }
.btn-continuar:disabled{ background:#C9CFC8; cursor:not-allowed; }

/* ---------- Formulario de pedido ---------- */

.campo{ margin-bottom:14px; }
.campo label{
  display:block;
  font-size:12.5px;
  font-weight:600;
  color:var(--texto-suave);
  margin-bottom:5px;
}
.campo input, .campo textarea{
  width:100%;
  border:1px solid var(--linea);
  border-radius:9px;
  padding:9px 11px;
  font-family:'Karla', sans-serif;
  font-size:14px;
  color:var(--texto);
}
.campo textarea{ resize:vertical; min-height:60px; }

.opciones-entrega{
  display:flex;
  gap:8px;
  margin-bottom:16px;
}
.opcion-entrega{
  flex:1;
  border:1px solid var(--linea);
  border-radius:10px;
  padding:10px;
  text-align:center;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  color:var(--texto-suave);
}
.opcion-entrega.activo{
  border-color:var(--verde-hoja);
  background:#EAF2EE;
  color:var(--verde-oscuro);
}

.volver{
  background:none;
  border:none;
  color:var(--verde-hoja);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:14px;
}

.aviso-envio{
  font-size:12px;
  color:var(--texto-suave);
  background:var(--crema);
  border-radius:8px;
  padding:9px 11px;
  margin-bottom:14px;
}

@media (max-width:480px){
  .header-top{ flex-direction:column; }
  .btn-carrito{ align-self:flex-start; }
}
</style>
</head>
<body>

<header class="tienda">
  <div class="header-inner">
    <div class="header-top">
      <div class="marca">
        <h1 id="nombreTienda">Doña Limpia</h1>
        <p id="descTienda">Productos de limpieza para tu casa y tu negocio. Elegí, armá tu pedido y coordinamos todo por WhatsApp.</p>
      </div>
      <button class="btn-carrito" id="btnAbrirCarrito">
        🛒 Carrito <span class="badge" id="cantidadCarrito">0</span>
      </button>
    </div>
    <div class="info-envio">
      <span class="chip">🚚 Envío a domicilio (a cargo del cliente)</span>
      <span class="chip">🏪 Retiro en el local</span>
    </div>
  </div>
</header>

<div class="categorias" id="categorias"></div>

<main>
  <div class="grilla" id="grillaProductos"></div>
</main>

<!-- ---------- Carrito ---------- -->
<div class="fondo-oscuro" id="fondoOscuro"></div>

<aside class="panel-carrito" id="panelCarrito">

  <div class="panel-header">
    <h2 id="tituloPanel">Tu pedido</h2>
    <button class="cerrar" id="btnCerrarCarrito">✕</button>
  </div>

  <div class="panel-body" id="cuerpoPanel">
    <!-- se llena con JS -->
  </div>

  <div class="panel-footer" id="piePanel">
    <!-- se llena con JS -->
  </div>

</aside>

<script>
/* ======================================================================
   ⚙️  CONFIGURACIÓN — ACÁ ES DONDE PEDRO EDITA CADA CATÁLOGO
   No hace falta saber programar: es solo cambiar lo que está entre comillas
   o los números, respetando las comas.
   ====================================================================== */

// 1) Datos del comercio
const TIENDA = {
  nombre: "Doña Limpia",
  descripcion: "Productos de limpieza para tu casa y tu negocio. Elegí, armá tu pedido y coordinamos todo por WhatsApp.",
  // Número de WhatsApp SIN el "+", SIN espacios ni guiones.
  // Ejemplo Argentina Chacabuco: código país 54 + 9 + código de área SIN el 0 + número SIN el 15
  whatsapp: "5491122334455",
  // Costo de envío: solo para mostrarlo en el mensaje. El envío lo paga el cliente.
  envio: "El costo de envío es de $2500. Se abonara al momento de recibir su pedido"
};

// 2) Categorías (tienen que coincidir con la "categoria" de cada producto)
const CATEGORIAS = ["Todos", "Limpieza de ropa", "Limpieza del hogar", "Higiene personal", "Bazar"];

// 3) Productos.
//    "icono" es un emoji que se usa como foto de ejemplo. Cuando Pedro tenga
//    fotos reales, se cambia foto-producto por una <img> (se explica abajo
//    del código, en el mensaje de Claude).
// "imagen" es OPCIONAL: es el nombre del archivo de la foto real del producto,
// guardado en una carpeta llamada "imagenes" al lado de este archivo.
// Si un producto no tiene "imagen" (o la línea no está), se muestra el emoji "icono" como antes.
const PRODUCTOS = [
  { id:1, nombre:"Detergente concentrado 750ml", categoria:"Limpieza de ropa", precio:2200, icono:"🧴", imagen:"imagenes/detergente.jpg", desc:"Rinde hasta 40 lavados" },
  { id:2, nombre:"Suavizante para ropa 900ml", categoria:"Limpieza de ropa", precio:1900, icono:"🌸", desc:"Aroma floral" },
  { id:3, nombre:"Lavandina 1L", categoria:"Limpieza del hogar", precio:900, icono:"🧪", desc:"Desinfecta y blanquea" },
  { id:4, nombre:"Limpiador multiuso 500ml", categoria:"Limpieza del hogar", precio:1500, icono:"🧽", desc:"Para pisos y superficies" },
  { id:5, nombre:"Esponjas x3", categoria:"Limpieza del hogar", precio:800, icono:"🧻", desc:"Doble faz, resistentes" },
  { id:6, nombre:"Paño de piso", categoria:"Limpieza del hogar", precio:1100, icono:"🧹", desc:"Absorbente, lavable" },
  { id:7, nombre:"Jabón en polvo 800g", categoria:"Limpieza de ropa", precio:2600, icono:"🫧", desc:"Para lavado a mano y máquina" },
  { id:8, nombre:"Papel higiénico x4", categoria:"Higiene personal", precio:1700, icono:"🧻", desc:"Hoja doble" }
];

/* ======================================================================
   A PARTIR DE ACÁ ES EL FUNCIONAMIENTO DEL CATÁLOGO.
   No hace falta tocar nada de lo que sigue.
   ====================================================================== */

document.getElementById("nombreTienda").textContent = TIENDA.nombre;
document.getElementById("descTienda").textContent = TIENDA.descripcion;
document.title = "Catálogo " + TIENDA.nombre;

let carrito = [];
try{
  const guardado = localStorage.getItem("carrito_" + TIENDA.nombre);
  if(guardado) carrito = JSON.parse(guardado);
}catch(e){ carrito = []; }

let categoriaActiva = "Todos";
let vistaCarrito = "lista"; // "lista" | "formulario"
let entregaElegida = "retiro"; // "retiro" | "envio"

function guardarCarrito(){
  try{ localStorage.setItem("carrito_" + TIENDA.nombre, JSON.stringify(carrito)); }catch(e){}
}

function formatoPrecio(numero){
  return "$" + numero.toLocaleString("es-AR");
}

// ---------- Categorías ----------
function pintarCategorias(){
  const cont = document.getElementById("categorias");
  cont.innerHTML = "";
  CATEGORIAS.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === categoriaActiva ? " activo" : "");
    btn.textContent = cat;
    btn.onclick = () => { categoriaActiva = cat; pintarCategorias(); pintarProductos(); };
    cont.appendChild(btn);
  });
}

// ---------- Grilla de productos ----------
function pintarProductos(){
  const cont = document.getElementById("grillaProductos");
  cont.innerHTML = "";
  const lista = PRODUCTOS.filter(p => categoriaActiva === "Todos" || p.categoria === categoriaActiva);

  lista.forEach(p => {
    const card = document.createElement("div");
    card.className = "producto";
    const foto = p.imagen
      ? `<img src="${p.imagen}" alt="${p.nombre}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'emoji-respaldo',textContent:'${p.icono}'}))">`
      : p.icono;

    card.innerHTML = `
      <div class="foto-producto">${foto}</div>
      <div class="datos-producto">
        <div class="nombre-producto">${p.nombre}</div>
        <div class="desc-producto">${p.desc || ""}</div>
        <div class="fila-precio">
          <span class="precio">${formatoPrecio(p.precio)}</span>
          <button class="btn-agregar">Agregar</button>
        </div>
      </div>
    `;
    card.querySelector(".btn-agregar").onclick = () => agregarAlCarrito(p);
    cont.appendChild(card);
  });
}

// ---------- Lógica del carrito ----------
function agregarAlCarrito(producto){
  const existente = carrito.find(i => i.id === producto.id);
  if(existente){ existente.cantidad += 1; }
  else{ carrito.push({ ...producto, cantidad: 1 }); }
  guardarCarrito();
  actualizarBadge();
  abrirCarrito();
}

function cambiarCantidad(id, delta){
  const item = carrito.find(i => i.id === id);
  if(!item) return;
  item.cantidad += delta;
  if(item.cantidad <= 0){ carrito = carrito.filter(i => i.id !== id); }
  guardarCarrito();
  actualizarBadge();
  pintarPanelCarrito();
}

function quitarDelCarrito(id){
  carrito = carrito.filter(i => i.id !== id);
  guardarCarrito();
  actualizarBadge();
  pintarPanelCarrito();
}

function subtotalCarrito(){
  return carrito.reduce((acc, i) => acc + i.precio * i.cantidad, 0);
}

function cantidadTotalCarrito(){
  return carrito.reduce((acc, i) => acc + i.cantidad, 0);
}

function actualizarBadge(){
  document.getElementById("cantidadCarrito").textContent = cantidadTotalCarrito();
}

// ---------- Panel lateral ----------
function abrirCarrito(){
  vistaCarrito = "lista";
  document.getElementById("fondoOscuro").classList.add("abierto");
  document.getElementById("panelCarrito").classList.add("abierto");
  pintarPanelCarrito();
}

function cerrarCarrito(){
  document.getElementById("fondoOscuro").classList.remove("abierto");
  document.getElementById("panelCarrito").classList.remove("abierto");
}

function pintarPanelCarrito(){
  if(vistaCarrito === "lista"){ pintarVistaLista(); }
  else{ pintarVistaFormulario(); }
}

function pintarVistaLista(){
  document.getElementById("tituloPanel").textContent = "Tu pedido";
  const cuerpo = document.getElementById("cuerpoPanel");
  const pie = document.getElementById("piePanel");

  if(carrito.length === 0){
    cuerpo.innerHTML = `<p class="vacio">Todavía no agregaste productos.</p>`;
    pie.innerHTML = "";
    return;
  }

  cuerpo.innerHTML = carrito.map(i => `
    <div class="item-carrito">
      <div class="item-icono">${i.icono}</div>
      <div class="item-info">
        <div class="item-nombre">${i.nombre}</div>
        <div class="item-precio-unit">${formatoPrecio(i.precio)} c/u</div>
        <div class="stepper">
          <button onclick="cambiarCantidad(${i.id}, -1)">−</button>
          <span>${i.cantidad}</span>
          <button onclick="cambiarCantidad(${i.id}, 1)">+</button>
        </div>
        <button class="quitar" onclick="quitarDelCarrito(${i.id})">Quitar</button>
      </div>
    </div>
  `).join("");

  pie.innerHTML = `
    <div class="fila-subtotal">
      <span>Subtotal</span>
      <span>${formatoPrecio(subtotalCarrito())}</span>
    </div>
    <button class="btn-continuar" id="btnContinuar">Continuar pedido</button>
  `;
  document.getElementById("btnContinuar").onclick = () => {
    vistaCarrito = "formulario";
    pintarPanelCarrito();
  };
}

function pintarVistaFormulario(){
  document.getElementById("tituloPanel").textContent = "Tus datos";
  const cuerpo = document.getElementById("cuerpoPanel");
  const pie = document.getElementById("piePanel");

  cuerpo.innerHTML = `
    <button class="volver" id="btnVolver">← Volver al pedido</button>

    <div class="opciones-entrega">
      <div class="opcion-entrega ${entregaElegida === 'retiro' ? 'activo' : ''}" id="optRetiro">🏪 Retiro en el local</div>
      <div class="opcion-entrega ${entregaElegida === 'envio' ? 'activo' : ''}" id="optEnvio">🚚 Envío a domicilio</div>
    </div>

    ${entregaElegida === 'envio' ? `<div class="aviso-envio">${TIENDA.envio}</div>` : ""}

    <div class="campo">
      <label>Nombre y apellido</label>
      <input type="text" id="campoNombre" placeholder="Tu nombre">
    </div>
    <div class="campo">
      <label>Teléfono</label>
      <input type="tel" id="campoTelefono" placeholder="Tu número de contacto">
    </div>
    ${entregaElegida === 'envio' ? `
    <div class="campo">
      <label>Dirección de entrega</label>
      <input type="text" id="campoDireccion" placeholder="Calle, número, referencia">
    </div>` : ""}
    <div class="campo">
      <label>Aclaraciones (opcional)</label>
      <textarea id="campoNotas" placeholder="Ej: horario preferido, forma de pago, etc."></textarea>
    </div>
  `;

  document.getElementById("btnVolver").onclick = () => { vistaCarrito = "lista"; pintarPanelCarrito(); };
  document.getElementById("optRetiro").onclick = () => { entregaElegida = "retiro"; pintarVistaFormulario(); };
  document.getElementById("optEnvio").onclick = () => { entregaElegida = "envio"; pintarVistaFormulario(); };

  pie.innerHTML = `<button class="btn-continuar" id="btnEnviarPedido">Enviar pedido por WhatsApp</button>`;
  document.getElementById("btnEnviarPedido").onclick = enviarPedidoPorWhatsapp;
}

// ---------- Armado y envío del mensaje de WhatsApp ----------
function enviarPedidoPorWhatsapp(){
  const nombre = document.getElementById("campoNombre").value.trim();
  const telefono = document.getElementById("campoTelefono").value.trim();
  const direccion = entregaElegida === "envio" ? document.getElementById("campoDireccion").value.trim() : "";
  const notas = document.getElementById("campoNotas").value.trim();

  if(!nombre || !telefono){
    alert("Por favor completá al menos tu nombre y tu teléfono.");
    return;
  }
  if(entregaElegida === "envio" && !direccion){
    alert("Por favor completá la dirección de entrega.");
    return;
  }

  let mensaje = `Hola ${TIENDA.nombre}! Quiero hacer este pedido:%0A%0A`;

  carrito.forEach(i => {
    mensaje += `• ${i.cantidad} x ${i.nombre} — ${formatoPrecio(i.precio * i.cantidad)}%0A`;
  });

  mensaje += `%0ATotal: ${formatoPrecio(subtotalCarrito())}%0A%0A`;
  mensaje += `Modalidad: ${entregaElegida === "envio" ? "Envío a domicilio" : "Retiro en el local"}%0A`;
  mensaje += `Nombre: ${nombre}%0A`;
  mensaje += `Teléfono: ${telefono}%0A`;
  if(direccion) mensaje += `Dirección: ${direccion}%0A`;
  if(notas) mensaje += `Notas: ${notas}%0A`;

  const url = `https://wa.me/${TIENDA.whatsapp}?text=${mensaje}`;
  window.open(url, "_blank");

  carrito = [];
  guardarCarrito();
  actualizarBadge();
  cerrarCarrito();
}

// ---------- Eventos generales ----------
document.getElementById("btnAbrirCarrito").onclick = abrirCarrito;
document.getElementById("btnCerrarCarrito").onclick = cerrarCarrito;
document.getElementById("fondoOscuro").onclick = cerrarCarrito;

// ---------- Arranque ----------
pintarCategorias();
pintarProductos();
actualizarBadge();
</script>
